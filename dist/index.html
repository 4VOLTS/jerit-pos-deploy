    <!-- ── CANONICAL HOST ────────────────────────────────────────────────
         The site answers on several hostnames — posfix.jerit.my plus the
         Firebase defaults (jerit-pos.web.app, jerit-pos.firebaseapp.com) and
         any preview channel. Only the custom domain should be usable, so
         everything else bounces here, keeping the path, query and hash.

         Firebase Hosting cannot do this: `redirects` in firebase.json match
         on PATH only, with no condition on the incoming host. So it runs here
         instead, first thing in <head>, before the app bundle is even
         requested — the visitor lands on the right host without seeing the
         wrong one paint.

         localhost stays exempt: `npm run dev` and `vite preview` (which the
         smoke test drives) must keep working.

          IT MUST NOT REDIRECT BEFORE THE DOMAIN WORKS. A plain redirect
         shipped early would forward every default host to a domain that is
         not answering, leaving no reachable URL at all. So it asks first:
         it fetches a small canary file from the canonical host and only
         redirects if OUR site answers.

         The canary is served by Firebase with an Access-Control-Allow-Origin
         header (see firebase.json). Anything else answering that hostname —
         today it is Vercel's wildcard returning 404 — has no such header, so
         the fetch is rejected by CORS and nothing happens. DNS that does not
         resolve rejects too. The check fails closed in every direction.

         This is what lets the redirect switch itself on the moment the CNAME
         lands, with no second deploy. -->
    <script>
      (function () {
        var CANONICAL = "posfix.jerit.my";
        var h = location.hostname;
        if (h === CANONICAL) return;
        if (h === "localhost" || h === "127.0.0.1" || h === "[::1]") return;
        if (!window.fetch || !window.AbortController) return;

        var stop = new AbortController();
        // A slow or hanging host must not leave the page waiting; 3s is well
        // past a normal round trip and short enough not to be noticed.
        var timer = setTimeout(function () { stop.abort(); }, 3000);

        fetch("https://" + CANONICAL + "/__canary.json?t=" + Date.now(), {
          signal: stop.signal, cache: "no-store", mode: "cors",
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            if (!j || j.app !== "jerit-pos") return;
            location.replace("https://" + CANONICAL + location.pathname + location.search + location.hash);
          })
          .catch(function () { /* not live yet — stay where we are */ })
          .then(function () { clearTimeout(timer); });
      })();
    </script>

    <!-- The sign-in screen is the first thing anyone sees, and its logo used
         to start downloading only after React had mounted and painted the

    <link rel="preload" as="image" href="/posfix-logo.png" />
    <script>
      // Registered here rather than from the bundle so it survives a bundle
      // that fails to parse — which is the exact moment offline matters most.
      //
      // After load, never before: the worker fetches every file it precaches,
      // and doing that while the page is still fetching the same files makes
      // the first visit slower for no gain.
      if ("serviceWorker" in navigator) {
        // An installed app used to need TWO opens to pick up a deploy: the
        // first fetched the new worker while the page it was already showing
        // came from the old one. From the outside that is indistinguishable
        // from "the fix did not work".
        //
        // So when a NEW worker takes over, reload once. Guarded twice: only
        // when a worker was already in charge (a first-ever install must not
        // reload), and only within the first 15 seconds, so this can never
        // fire under someone mid-sale. After that the in-app update notice
        // takes over, and it already waits for an idle screen.
        var had = !!navigator.serviceWorker.controller;
        var opened = Date.now();
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (had && Date.now() - opened < 15000) window.location.reload();
        });
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>

        /* The ground is a radial gradient lifted from the redesign. It lives

           the app container and every nested screen that inherits it restarts
           its own gradient, and the seams show.

           The ellipse is 800% wide, not the 120% it was drawn at (7/9/2026).
           Since the iOS status bar came off black-translucent, that strip
           belongs to the system and can only be ONE flat colour — it cannot
           carry a gradient. At 120% the dome is centred on 50% 0%, so the top
           row of the page ran from #F7F5EC in the middle to 6 levels darker at
           each edge, and the flat strip met a page that disagreed with it
           everywhere except dead centre. That mismatch read as a line across
           the top, and as a separate block above the app.

           Widening the ellipse flattens the horizontal falloff without
           touching the vertical one: measured down the centre, the fade hits
           the same values at the same heights as before, and the top row now
           varies by 1 level across the full width, which is below anything a
           screen can show. A plain vertical linear-gradient would give exactly
           0, but it also changes the fade itself, and the dome is the design. */
        background-color: #EDEBE2;
        background-image: radial-gradient(800% 60% at 50% 0%, #F7F5EC 0%, #F1EFE5 55%, #EAE8DD 100%);

    <!-- ── STARTUP WALLPAPER ─────────────────────────────────────
         The owner's startup screen (13/9/2026). It is HERE, in the HTML,
         and not in React, because it has to be the first thing painted —
         before the bundle has downloaded, before Firebase has answered.
         Every open starts on this picture and all the waiting happens
         behind it.

         The picture is INLINED. As a separate file it was the one request
         the page had to wait for, and on a phone that wait was a blank cream
         page for up to two seconds before the wordmark appeared (owner,
         13/9/2026). Inline, there is nothing to wait for: the HTML that
         paints the cream carries the picture in the same bytes. 28KB on
         each open, against a two-second blank.

         The spinner is drawn by CSS, not baked into the picture. A baked
         ring is a still ring, and a still spinner reads as a hung app. The
         ring was painted out of the picture at export and this one sits
         exactly where it was, sized from the picture so it lands in the same
         place at every screen size.

         `contain` on the cream, not `cover`: phones are taller than the
         picture, and cropping would cut the wordmark or the footer.

         src/ui/splash.js decides when it leaves — when the first screen a
         person can act on is ready — and brings it back for a second load
         after Lock. Nothing else touches it. -->
