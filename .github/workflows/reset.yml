# Reset the live POSFIX project to new and empty (owner, 29/9/2026: every
# shop on it was a test shop). Manual only. Runs scripts/reset-system.mjs
# from the private source, checked out read-only into the runner, the same
# way server.yml does; nothing from the source is committed here.
#
# "dry run" (the default) only COUNTS. "RESET POSFIX" deletes every shop,
# record, non-operator account and shop file, and the shop-number counter, so
# the next shop to register is #1. The script prints counts only: these logs
# are public.

name: Reset

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry run counts only; RESET POSFIX deletes"
        type: choice
        options:
          - dry run
          - RESET POSFIX
        default: dry run

concurrency:
  group: reset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the private source (read-only)
        uses: actions/checkout@v4
        with:
          repository: 4VOLTS/jerit-pos
          ref: main
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show which commit runs
        working-directory: src
        run: git log -1 --format='%h %s'

      - name: Write the key
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"

      - name: Install the admin SDK
        working-directory: src
        run: npm --prefix functions ci || npm --prefix functions install

      - name: Reset (or count)
        working-directory: src
        env:
          RESET_CONFIRM: ${{ inputs.mode == 'RESET POSFIX' && 'RESET POSFIX' || '' }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node scripts/reset-system.mjs

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
